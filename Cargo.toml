[package]
name = "guanqi"
version = "0.1.0"
edition = "2024"
description = "观棋 —— KataGo 围棋 AI 引擎图形前端"
license = "MIT"
# 仅通过发行版包管理器分发（pacman 等），不发布到 crates.io。
publish = false

[dependencies]
eframe = "0.36"
egui = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 复盘报告的棋盘图 PNG 编码（阶段 21 #6）。全项目唯一图像编码依赖：
# 只做编码（棋盘图自绘 RGBA），不引入 image 这类全家桶。
png = "0.18"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
