[package]
name = "guanqi"
version = "0.1.0"
edition = "2024"
description = "观棋 —— KataGo 围棋 AI 引擎图形前端"
# 仅通过发行版包管理器分发（pacman 等），不发布到 crates.io。
publish = false

[dependencies]
eframe = "0.36"
egui = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
