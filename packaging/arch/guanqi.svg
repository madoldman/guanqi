<?xml version="1.0" encoding="UTF-8"?>
<!--
  观棋 (Guanqi) 应用图标 —— 打包期资源（仅由发行版打包引用，不进入 Rust 构建）
  构成：圆角木质棋盘 + 五路网格 + 星位 + 一黑一白接触位棋子
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- 棋盘木色：左上受光到右下阴影的轻微过渡 -->
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5b964"/>
      <stop offset="1" stop-color="#c6943f"/>
    </linearGradient>
    <!-- 黑子：左上方高光到深黑 -->
    <radialGradient id="black-stone" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#6b6b6b"/>
      <stop offset="0.35" stop-color="#2e2e2e"/>
      <stop offset="1" stop-color="#0c0c0c"/>
    </radialGradient>
    <!-- 白子：中央白到边缘浅灰 -->
    <radialGradient id="white-stone" cx="0.4" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.8" stop-color="#eeeee8"/>
      <stop offset="1" stop-color="#cfcfc4"/>
    </radialGradient>
  </defs>

  <!-- 棋盘底 -->
  <rect x="2" y="2" width="96" height="96" rx="20" fill="url(#wood)"/>
  <rect x="2" y="2" width="96" height="96" rx="20" fill="none" stroke="#8a6428" stroke-width="1.5"/>

  <!-- 五路网格（间距 17，行列线 16/33/50/67/84） -->
  <g stroke="#7a5a2c" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
    <line x1="16" y1="16" x2="16" y2="84"/>
    <line x1="33" y1="16" x2="33" y2="84"/>
    <line x1="50" y1="16" x2="50" y2="84"/>
    <line x1="67" y1="16" x2="67" y2="84"/>
    <line x1="84" y1="16" x2="84" y2="84"/>
    <line x1="16" y1="16" x2="84" y2="16"/>
    <line x1="16" y1="33" x2="84" y2="33"/>
    <line x1="16" y1="50" x2="84" y2="50"/>
    <line x1="16" y1="67" x2="84" y2="67"/>
    <line x1="16" y1="84" x2="84" y2="84"/>
  </g>

  <!-- 星位（避开棋子所在的接触位） -->
  <g fill="#7a5a2c">
    <circle cx="16" cy="16" r="1.6"/>
    <circle cx="84" cy="16" r="1.6"/>
    <circle cx="16" cy="84" r="1.6"/>
    <circle cx="84" cy="84" r="1.6"/>
    <circle cx="67" cy="67" r="1.6"/>
  </g>

  <!-- 黑子 (33,33) 投影 + 本体 -->
  <circle cx="34" cy="35" r="8.4" fill="#000000" opacity="0.28"/>
  <circle cx="33" cy="33" r="8" fill="url(#black-stone)"/>
  <ellipse cx="30.2" cy="30.4" rx="2.6" ry="1.7" fill="#ffffff" opacity="0.22" transform="rotate(-25 30.2 30.4)"/>

  <!-- 白子 (50,33) 投影 + 本体 -->
  <circle cx="51" cy="35" r="8.4" fill="#000000" opacity="0.22"/>
  <circle cx="50" cy="33" r="8" fill="url(#white-stone)" stroke="#b3b3a6" stroke-width="0.7"/>
  <ellipse cx="47.2" cy="30.4" rx="2.6" ry="1.7" fill="#ffffff" opacity="0.75" transform="rotate(-25 47.2 30.4)"/>
</svg>
